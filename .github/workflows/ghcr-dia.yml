name: Build & publish GHCR (D-IA)

# Construye la imagen de OpenReply (fork de D-IA) y la sube a ghcr.io.
# El VPS (easypanel, Docker Swarm) no construye: solo hace pull de esta
# imagen, igual que dia-jarvis.
#
#   1. Push a la rama dia
#   2. Esta action construye y pushea ghcr.io/equipo-rgb/openreply:dia
#   3. En easypanel, Deploy en los servicios web, worker y cron

on:
  push:
    branches: [dia]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GHCR_TOKEN (PAT con write:packages) si esta definido; si no,
          # el GITHUB_TOKEN del propio run.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
